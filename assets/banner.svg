<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Rishi P Kulkarni: AI Systems Engineer in the Making. Data engineering, efficient AI." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#F4F0E6" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="canvas"><rect width="1200" height="300" rx="14"/></clipPath>
  </defs>
  <style>
    .mono  { font-family: 'JetBrains Mono','SFMono-Regular',Consolas,Menlo,'Liberation Mono',monospace; }
    .black { font-family: 'Archivo Black','Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif; font-weight: 900; }
    .serif { font-family: 'Instrument Serif','Playfair Display',Georgia,'Times New Roman',serif; font-style: italic; }
    .chip  { font-size: 11px; font-weight: 600; }
    .name  { font-size: 52px; fill: #F4F0E6; }
    .sub   { font-size: 28px; fill: #F4F0E6; fill-opacity: .72; }
    .cap   { font-size: 11px; fill: #8F897A; letter-spacing: 2.5px; }
    .l     { font-size: 30px; fill: #D1A93A; opacity: 0; animation: cycle 12s infinite; }
    .l1    { opacity: 1; animation-delay: 0s; }
    .l2    { animation-delay: 3s; }
    .l3    { animation-delay: 6s; }
    .l4    { animation-delay: 9s; }
    .e line { stroke: #F4F0E6; stroke-opacity: .13; stroke-width: 1; }
    .flow  { fill: none; stroke: #D1A93A; stroke-width: 2; stroke-linejoin: round; stroke-dasharray: 5 13; animation: flow 1.4s linear infinite; }
    .n     { animation: pulse 3s ease-in-out infinite; }
    @keyframes cycle {
      0%   { opacity: 0; transform: translateY(8px); }
      4%   { opacity: 1; transform: translateY(0); }
      22%  { opacity: 1; transform: translateY(0); }
      26%  { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 0; }
    }
    @keyframes flow  { to { stroke-dashoffset: -18; } }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .l, .n, .flow { animation: none; }
      .l1 { opacity: 1; }
    }
  </style>

  <g clip-path="url(#canvas)">
    <rect width="1200" height="300" fill="#0E0D0A"/>
    <rect width="1200" height="300" fill="url(#dots)"/>

    <!-- hard gold offset shadow + card -->
    <rect x="38" y="38" width="1120" height="236" rx="10" fill="#D1A93A"/>
    <rect x="28" y="28" width="1120" height="236" rx="10" fill="#15130F" stroke="#F4F0E6" stroke-width="2"/>

    <!-- neural net -->
    <g class="e"><line x1="820" y1="86" x2="920" y2="66"/><line x1="820" y1="86" x2="920" y2="116"/><line x1="820" y1="86" x2="920" y2="176"/><line x1="820" y1="86" x2="920" y2="226"/><line x1="820" y1="146" x2="920" y2="66"/><line x1="820" y1="146" x2="920" y2="116"/><line x1="820" y1="146" x2="920" y2="176"/><line x1="820" y1="146" x2="920" y2="226"/><line x1="820" y1="206" x2="920" y2="66"/><line x1="820" y1="206" x2="920" y2="116"/><line x1="820" y1="206" x2="920" y2="176"/><line x1="820" y1="206" x2="920" y2="226"/><line x1="920" y1="66" x2="1020" y2="66"/><line x1="920" y1="66" x2="1020" y2="116"/><line x1="920" y1="66" x2="1020" y2="176"/><line x1="920" y1="66" x2="1020" y2="226"/><line x1="920" y1="116" x2="1020" y2="66"/><line x1="920" y1="116" x2="1020" y2="116"/><line x1="920" y1="116" x2="1020" y2="176"/><line x1="920" y1="116" x2="1020" y2="226"/><line x1="920" y1="176" x2="1020" y2="66"/><line x1="920" y1="176" x2="1020" y2="116"/><line x1="920" y1="176" x2="1020" y2="176"/><line x1="920" y1="176" x2="1020" y2="226"/><line x1="920" y1="226" x2="1020" y2="66"/><line x1="920" y1="226" x2="1020" y2="116"/><line x1="920" y1="226" x2="1020" y2="176"/><line x1="920" y1="226" x2="1020" y2="226"/><line x1="1020" y1="66" x2="1112" y2="116"/><line x1="1020" y1="66" x2="1112" y2="176"/><line x1="1020" y1="116" x2="1112" y2="116"/><line x1="1020" y1="116" x2="1112" y2="176"/><line x1="1020" y1="176" x2="1112" y2="116"/><line x1="1020" y1="176" x2="1112" y2="176"/><line x1="1020" y1="226" x2="1112" y2="116"/><line x1="1020" y1="226" x2="1112" y2="176"/></g>
    <path d="M820,86 L920,116 L1020,66 L1112,116" class="flow" style="animation-delay:0.0s"/><path d="M820,146 L920,176 L1020,116 L1112,176" class="flow" style="animation-delay:0.5s"/><path d="M820,206 L920,66 L1020,226 L1112,116" class="flow" style="animation-delay:1.0s"/>
    <rect class="n" x="813" y="79" width="14" height="14" rx="2" fill="#15130F" stroke="#F4F0E6" stroke-width="1.5" style="animation-delay:0.00s"/><rect class="n" x="813" y="139" width="14" height="14" rx="2" fill="#15130F" stroke="#F4F0E6" stroke-width="1.5" style="animation-delay:0.35s"/><rect class="n" x="813" y="199" width="14" height="14" rx="2" fill="#15130F" stroke="#F4F0E6" stroke-width="1.5" style="animation-delay:0.70s"/><rect class="n" x="913" y="59" width="14" height="14" rx="2" fill="#15130F" stroke="#F4F0E6" stroke-width="1.5" style="animation-delay:1.05s"/><rect class="n" x="913" y="109" width="14" height="14" rx="2" fill="#15130F" stroke="#F4F0E6" stroke-width="1.5" style="animation-delay:1.40s"/><rect class="n" x="913" y="169" width="14" height="14" rx="2" fill="#15130F" stroke="#F4F0E6" stroke-width="1.5" style="animation-delay:1.75s"/><rect class="n" x="913" y="219" width="14" height="14" rx="2" fill="#15130F" stroke="#F4F0E6" stroke-width="1.5" style="animation-delay:2.10s"/><rect class="n" x="1013" y="59" width="14" height="14" rx="2" fill="#15130F" stroke="#F4F0E6" stroke-width="1.5" style="animation-delay:0.00s"/><rect class="n" x="1013" y="109" width="14" height="14" rx="2" fill="#15130F" stroke="#F4F0E6" stroke-width="1.5" style="animation-delay:0.35s"/><rect class="n" x="1013" y="169" width="14" height="14" rx="2" fill="#15130F" stroke="#F4F0E6" stroke-width="1.5" style="animation-delay:0.70s"/><rect class="n" x="1013" y="219" width="14" height="14" rx="2" fill="#15130F" stroke="#F4F0E6" stroke-width="1.5" style="animation-delay:1.05s"/><rect class="n" x="1105" y="109" width="14" height="14" rx="2" fill="#D1A93A" stroke="#D1A93A" stroke-width="1.5" style="animation-delay:1.40s"/><rect class="n" x="1105" y="169" width="14" height="14" rx="2" fill="#D1A93A" stroke="#D1A93A" stroke-width="1.5" style="animation-delay:1.75s"/>

    <!-- text -->
    <rect x="76" y="50" width="180" height="26" rx="3" fill="#D1A93A" stroke="#D1A93A" stroke-width="1.5"/><text x="90" y="67.5" class="mono chip" fill="#15130F" textLength="152" lengthAdjust="spacing">OPEN TO COLLABORATE</text><rect x="266" y="50" width="156" height="26" rx="3" fill="none" stroke="#F4F0E6" stroke-width="1.5"/><text x="280" y="67.5" class="mono chip" fill="#F4F0E6" textLength="128" lengthAdjust="spacing">DATA ENGINEERING</text><rect x="432" y="50" width="124" height="26" rx="3" fill="none" stroke="#F4F0E6" stroke-width="1.5"/><text x="446" y="67.5" class="mono chip" fill="#F4F0E6" textLength="96" lengthAdjust="spacing">EFFICIENT AI</text><rect x="566" y="50" width="84" height="26" rx="3" fill="none" stroke="#F4F0E6" stroke-width="1.5"/><text x="580" y="67.5" class="mono chip" fill="#F4F0E6" textLength="56" lengthAdjust="spacing">EDGE AI</text>
    <text x="76" y="135" class="black name" textLength="640" lengthAdjust="spacingAndGlyphs">RISHI P KULKARNI</text>
    <text x="76" y="170" class="serif sub">AI Systems Engineer in the Making</text>

    <text x="76" y="218" class="serif l l1">Building data pipelines and backend systems</text>
    <text x="76" y="218" class="serif l l2">Optimizing LLM inference for edge devices</text>
    <text x="76" y="218" class="serif l l3">Exploring AI systems and distributed computing</text>
    <text x="76" y="218" class="serif l l4">Turning ideas into working software</text>

    <text x="76" y="250" class="mono cap">BUILD IT. MEASURE IT. IMPROVE IT.</text>
  </g>
</svg>
