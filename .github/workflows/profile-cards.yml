name: Profile Summary Cards

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # If this fails with "Resource not accessible by integration",
          # create a PAT (read:user + repo), save it as a repo secret named
          # PROFILE_TOKEN, and use ${{ secrets.PROFILE_TOKEN }} here instead.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
